# RF-07 · Baja de la cuenta de prueba (spec 003, RF-08): contraseña incorrecta no la elimina;
# la correcta sí, y después ya no se puede entrar. Spec 021 · T025: corre siempre al final (config.yaml)
# y, si un flujo anterior dejó una sesión abierta, la cierra antes para eliminar la cuenta efímera.
appId: ${APP_ID}
name: 09-baja
---
- stopApp
- runFlow: _shared/abrir.yaml
- extendedWaitUntil:
    visible: 'Iniciar sesión|Explorar'
    timeout: 60000
- runFlow:
    when:
      visible: 'Explorar'
    file: _shared/cerrar-sesion.yaml
- runFlow: _shared/iniciar-sesion.yaml
- extendedWaitUntil:
    visible: 'Explorar'
    timeout: 30000
- tapOn: 'Perfil'
- scrollUntilVisible:
    element: 'Eliminar cuenta'
- tapOn: 'Eliminar cuenta'
- tapOn: 'Tu contraseña'
- inputText: 'contraseña-incorrecta-1'
- hideKeyboard
- tapOn: 'Eliminar'
- assertVisible: 'La contraseña no es correcta.'
- tapOn: 'Tu contraseña'
- eraseText: 40
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: 'Eliminar'
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 30000
- runFlow: _shared/iniciar-sesion.yaml
- assertVisible: 'El correo o la contraseña no son correctos.'
