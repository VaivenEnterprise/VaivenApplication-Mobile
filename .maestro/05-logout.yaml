# RF-07 · Cerrar sesión desde Perfil; al reabrir la app ya no hay sesión (spec 003, RF-07).
appId: ${APP_ID}
---
- tapOn: 'Perfil'
- scrollUntilVisible:
    element: 'Cerrar sesión'
- tapOn: 'Cerrar sesión'
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 30000
- stopApp
- runFlow: _shared/abrir.yaml
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 60000
- assertNotVisible: 'Explorar'
