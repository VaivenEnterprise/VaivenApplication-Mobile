# RF-07 · Inicio de sesión con la cuenta creada en 00. Credenciales incorrectas no entran.
appId: ${APP_ID}
name: 01-login
---
- launchApp:
    clearState: true
- runFlow: _shared/abrir.yaml
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 60000
- tapOn: 'tu@correo.com'
- inputText: ${E2E_EMAIL}
- tapOn: 'Tu contraseña'
- inputText: 'contraseña-incorrecta-1'
- hideKeyboard
- tapOn: 'Iniciar sesión'
- assertVisible: 'El correo o la contraseña no son correctos.'
- runFlow:
    commands:
      - tapOn: 'Tu contraseña'
      - eraseText: 40
      - inputText: ${E2E_PASSWORD}
      - hideKeyboard
      - tapOn: 'Iniciar sesión'
- extendedWaitUntil:
    visible: 'Explorar'
    timeout: 30000
